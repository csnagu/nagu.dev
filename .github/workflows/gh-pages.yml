# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Keep only the newest deployment for this Pages site. This is useful when
# Pages CMS saves several edits in quick succession, and prevents a manual run
# from another ref from overlapping the main deployment.
concurrency:
  group: "pages-${{ github.workflow }}"
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: go.sum
      - name: Restore Hugo CLI cache
        id: hugo-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hugo-bin
          key: hugo-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}
      - name: Install Hugo CLI
        if: steps.hugo-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar --extract --gzip --file "$RUNNER_TEMP/hugo.tar.gz" \
            --directory "$RUNNER_TEMP/hugo-bin" hugo
          chmod +x "$RUNNER_TEMP/hugo-bin/hugo"
      - name: Add Hugo to PATH
        run: echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build production and preview with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --config hugo.toml \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cleanDestinationDir \
            --destination public
          hugo \
            --config hugo.toml,hugo.preview.toml \
            --buildDrafts \
            --minify \
            --destination public/preview
          rm -rf public/preview/images
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
