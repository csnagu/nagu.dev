{{- $toc := .Site.Params.toc -}}

{{ $tocCount := (findRE "<li" .TableOfContents) | len }}

{{- if isset .Params "toc" -}}
    {{ $toc = .Params.toc }}
{{- end -}}

{{- if $toc -}}
    {{ if gt $tocCount 3 }}
        {{ $tocOpen := "" }}
        {{ if or .Site.Params.tocOpen .Params.tocOpen }}
            {{ if not (eq .Params.tocOpen false) }}
                {{ $tocOpen = "open" }}
            {{ end }}
        {{ end }}
        <details class="toc" {{ $tocOpen }}>
            <summary><span class="toc-title">{{ T "single.table_of_contents" }}</span></summary>
            {{ .TableOfContents }}
        </details>
    {{ end }}
{{- end -}}
