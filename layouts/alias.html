<!doctype html>
<html lang="{{ .Site.Language.Locale }}">
<head>
  <title>{{ .Permalink }}</title>
  <link rel="canonical" href="{{ .Permalink }}">
  <meta charset="utf-8">
  {{- if .Site.Params.preview }}
  <meta name="robots" content="noindex,nofollow">
  {{- end }}
  <meta http-equiv="refresh" content="0; url={{ .Permalink }}">
</head>
</html>
